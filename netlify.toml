# Netlify deployment config for Healthy Steps Foundation (Next.js 16, App Router)
# The official plugin runs the Next.js runtime on Netlify — SSR/SSG, image
# optimization, and routing all work without a static export.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 requires a modern Node runtime
  NODE_VERSION = "20"
  # The Supabase project URL is public by design — it appears in every page that
  # renders an image uploaded through the content editor (Supabase Storage URLs
  # embed it), which otherwise fails Netlify's secrets scan. The real secrets
  # (SUPABASE_SERVICE_ROLE_KEY, ADMIN_*) stay scanned.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"

[functions]
  # Standalone functions (e.g. the recurring-reminders scheduled function) live
  # here, alongside — not instead of — the functions @netlify/plugin-nextjs
  # generates for the Next.js app itself.
  directory = "netlify/functions"

[[plugins]]
  package = "@netlify/plugin-nextjs"
